name: Đọc Sách – đóng gói APK

on:
  push:
    paths:
      - "doc-sach-android/**"
      - ".github/workflows/doc-sach-android.yml"
  pull_request:
    paths:
      - "doc-sach-android/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doc-sach-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: doc-sach-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Kiểm thử và đóng gói APK
        env:
          # Mã ứng dụng Microsoft để đăng nhập OneDrive (Settings › Secrets and variables › Actions › Variables).
          # Để trống thì nhập mã ngay trong ứng dụng.
          ONEDRIVE_CLIENT_ID: ${{ vars.ONEDRIVE_CLIENT_ID }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Đặt tên tệp APK
        run: cp app/build/outputs/apk/release/app-release.apk DocSach.apk

      - name: Lưu APK (tab Actions)
        uses: actions/upload-artifact@v4
        with:
          name: DocSach-apk
          path: doc-sach-android/DocSach.apk

      - name: Chụp ảnh giao diện ở kích thước Mix Fold 2
        continue-on-error: true
        run: ./gradlew testDebugUnitTest -Pscreenshots=true --tests "io.github.truongphamtp.docsach.ScreenshotTest"

      - name: Lưu ảnh giao diện
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anh-giao-dien
          path: doc-sach-android/app/build/screenshots/
          if-no-files-found: ignore

      - name: In ảnh thu nhỏ vào nhật ký (để xem lại nhanh)
        if: always()
        continue-on-error: true
        run: |
          shopt -s nullglob
          for f in app/build/screenshots-small/*.jpg; do
            echo "=====ANH-BAT-DAU $(basename "$f")"
            base64 -w 30000 "$f"
            echo "=====ANH-KET-THUC"
          done

      - name: Cập nhật bản tải về "doc-sach-moi-nhat"
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=doc-sach-moi-nhat
          NOTES="Bản dựng tự động từ nhánh ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}. Tải tệp DocSach.apk về điện thoại Android để cài đặt."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" DocSach.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" DocSach.apk --prerelease --target "$GITHUB_SHA" \
              --title "Đọc Sách – bản mới nhất" --notes "$NOTES"
          fi
